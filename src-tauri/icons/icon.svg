<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep warm background -->
    <radialGradient id="bg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1E1814"/>
      <stop offset="100%" stop-color="#0C0A09"/>
    </radialGradient>

    <!-- Warm ambient light from top-left -->
    <radialGradient id="ambient" cx="20%" cy="15%" r="60%">
      <stop offset="0%" stop-color="#2A1F17" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>

    <!-- Symbol gradient: warm amber to soft gold -->
    <linearGradient id="stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0D08C"/>
      <stop offset="50%" stop-color="#D4944C"/>
      <stop offset="100%" stop-color="#C07838"/>
    </linearGradient>

    <!-- Cursor glow -->
    <radialGradient id="cursorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F0D08C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F0D08C" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft ambient glow behind the symbol -->
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" ry="228" fill="url(#ambient)"/>

  <!-- Subtle inner border for depth -->
  <rect x="4" y="4" width="1016" height="1016" rx="224" ry="224"
        fill="none" stroke="#2A1F17" stroke-width="1" opacity="0.5"/>

  <!-- Glow layer -->
  <g filter="url(#softGlow)" opacity="0.25">
    <!-- Chevron glow -->
    <path d="M 290 370 L 440 512 L 290 654"
          stroke="#D4944C" stroke-width="72"
          stroke-linecap="round" stroke-linejoin="round"
          fill="none"/>
    <!-- Flow curve glow -->
    <path d="M 490 512 C 560 512, 590 420, 660 420 C 730 420, 730 512, 800 512"
          stroke="#D4944C" stroke-width="56"
          stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- Main chevron: clean > prompt -->
  <path d="M 290 370 L 440 512 L 290 654"
        stroke="url(#stroke)" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"
        fill="none"/>

  <!-- Flow curve: smooth S-wave representing data flow -->
  <path d="M 490 512 C 560 512, 590 420, 660 420 C 730 420, 730 512, 800 512"
        stroke="url(#stroke)" stroke-width="46"
        stroke-linecap="round"
        fill="none"/>

  <!-- Cursor dot with ambient glow -->
  <circle cx="800" cy="512" r="60" fill="url(#cursorGlow)"/>
  <circle cx="800" cy="512" r="24" fill="url(#stroke)" opacity="0.9"/>
</svg>
